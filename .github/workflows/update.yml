name: Update

# Opens a pull request when Vaultwarden publishes a release: it bumps the
# upstream versions and checksums in VERSIONS, nothing else. The maintainer
# merges it and publishes a release of this repository (release.yml then
# builds it and opens the pull request that pins it). This workflow never
# merges, tags or publishes anything, and needs no secret.
#
# Weekly, on Monday: Vaultwarden publishes every few weeks, a run with nothing
# to do is one API call, and a release is picked up within the week. For an
# urgent one (a security release), run it by hand: workflow_dispatch.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  UPSTREAM: dani-garcia/vaultwarden
  WEB_VAULT_UPSTREAM: dani-garcia/bw_web_builds

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # push the deps/vaultwarden-<version> branch
      pull-requests: write # open the pull request
      actions: write # start ci.yml and release.yml on that branch: a pull request opened with GITHUB_TOKEN triggers no workflow
    env:
      GH_TOKEN: ${{ github.token }}
      BASE: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # git push below; the job's token only lives for this run

      - name: Look for a newer Vaultwarden release
        id: latest
        run: |
          . scripts/lib/kv.sh
          # The latest release that is neither a draft nor a prerelease.
          latest="$(gh api "repos/$UPSTREAM/releases/latest" --jq 'select(.draft == false and .prerelease == false) | .tag_name')"
          [[ $latest =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo "::error::The latest $UPSTREAM release '$latest' is not a plain version: update VERSIONS by hand."; exit 1; }
          current="$(read_kv VERSIONS VAULTWARDEN_VERSION)"
          branch="deps/vaultwarden-$latest"
          update=false
          if [ "$latest" = "$current" ]; then
            echo "::notice::VERSIONS already has the latest Vaultwarden release ($current): nothing to do."
          elif [ "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n 1)" != "$latest" ]; then
            echo "::notice::VERSIONS has $current, which is newer than the latest release $latest: nothing to do."
          elif git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "::notice::The branch $branch already exists: its pull request is waiting for the maintainer."
          elif [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "::notice::A pull request from $branch is already open."
          else
            update=true
          fi
          {
            echo "update=$update"
            echo "current=$current"
            echo "latest=$latest"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"

      # Where each checksum comes from (the pull request says it too):
      # - WEB_VAULT_SHA256: the sha256sums.txt that bw_web_builds publishes
      #   with the web vault release; the tarball is then checked against it.
      # - VAULTWARDEN_SOURCE_SHA256: upstream publishes none for a source
      #   archive. It is computed here from the archive GitHub serves for the
      #   tag, once that archive is shown to be the commit the API names for
      #   the tag. The release build checks it again at every build.
      - name: Read upstream's checksums
        id: upstream
        if: steps.latest.outputs.update == 'true'
        env:
          LATEST: ${{ steps.latest.outputs.latest }}
        run: |
          src="$RUNNER_TEMP/vaultwarden-$LATEST.tar.gz"
          curl --proto '=https' --fail --silent --show-error --location --retry 3 \
            --output "$src" "https://github.com/$UPSTREAM/archive/refs/tags/$LATEST.tar.gz"
          tag_commit="$(gh api "repos/$UPSTREAM/commits/$LATEST" --jq .sha)"
          archive_commit="$(scripts/upstream-web-vault.sh commit-of "$src")"
          if [ "$archive_commit" != "$tag_commit" ]; then
            echo "::error::The source archive of $LATEST is commit $archive_commit, but the tag is $tag_commit. Not updating."
            exit 1
          fi
          source_sha256="$(sha256sum "$src" | cut -d ' ' -f 1)"

          # The web vault that this Vaultwarden release pins, never the latest one.
          tar -xzOf "$src" "vaultwarden-$LATEST/docker/DockerSettings.yaml" > "$RUNNER_TEMP/DockerSettings.yaml"
          web_vault_version="$(scripts/upstream-web-vault.sh vault-version "$RUNNER_TEMP/DockerSettings.yaml")"
          web="bw_web_$web_vault_version.tar.gz"
          base="https://github.com/$WEB_VAULT_UPSTREAM/releases/download/$web_vault_version"
          curl --proto '=https' --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/sha256sums.txt" "$base/sha256sums.txt"
          web_vault_sha256="$(scripts/upstream-web-vault.sh sha256-of "$RUNNER_TEMP/sha256sums.txt" "$web")"
          curl --proto '=https' --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/$web" "$base/$web"
          echo "$web_vault_sha256  $RUNNER_TEMP/$web" | sha256sum --check -
          {
            echo "source_sha256=$source_sha256"
            echo "commit=$tag_commit"
            echo "web_vault_version=$web_vault_version"
            echo "web_vault_sha256=$web_vault_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Bump VERSIONS on a new branch
        id: bump
        if: steps.latest.outputs.update == 'true'
        env:
          CURRENT: ${{ steps.latest.outputs.current }}
          LATEST: ${{ steps.latest.outputs.latest }}
          BRANCH: ${{ steps.latest.outputs.branch }}
          SOURCE_SHA256: ${{ steps.upstream.outputs.source_sha256 }}
          WEB_VAULT_VERSION: ${{ steps.upstream.outputs.web_vault_version }}
          WEB_VAULT_SHA256: ${{ steps.upstream.outputs.web_vault_sha256 }}
        run: |
          . scripts/lib/kv.sh
          old_web_vault="$(read_kv VERSIONS WEB_VAULT_VERSION)"
          git switch --create "$BRANCH"
          scripts/set-version.sh VERSIONS VAULTWARDEN_VERSION "$LATEST"
          scripts/set-version.sh VERSIONS VAULTWARDEN_SOURCE_SHA256 "$SOURCE_SHA256"
          scripts/set-version.sh VERSIONS WEB_VAULT_VERSION "$WEB_VAULT_VERSION"
          scripts/set-version.sh VERSIONS WEB_VAULT_SHA256 "$WEB_VAULT_SHA256"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --all --message "chore(deps): bump Vaultwarden from $CURRENT to $LATEST"
          git push origin "$BRANCH"
          echo "old_web_vault=$old_web_vault" >> "$GITHUB_OUTPUT"

      - name: Open the pull request and start its checks
        if: steps.latest.outputs.update == 'true'
        env:
          CURRENT: ${{ steps.latest.outputs.current }}
          LATEST: ${{ steps.latest.outputs.latest }}
          BRANCH: ${{ steps.latest.outputs.branch }}
          COMMIT: ${{ steps.upstream.outputs.commit }}
          SOURCE_SHA256: ${{ steps.upstream.outputs.source_sha256 }}
          WEB_VAULT_VERSION: ${{ steps.upstream.outputs.web_vault_version }}
          WEB_VAULT_SHA256: ${{ steps.upstream.outputs.web_vault_sha256 }}
          OLD_WEB_VAULT: ${{ steps.bump.outputs.old_web_vault }}
        run: |
          title="chore(deps): bump Vaultwarden from $CURRENT to $LATEST"
          body="Bumps the upstream versions in \`VERSIONS\`: Vaultwarden $CURRENT -> $LATEST ([release notes](https://github.com/$UPSTREAM/releases/tag/$LATEST)), web vault $OLD_WEB_VAULT -> $WEB_VAULT_VERSION (the one that Vaultwarden $LATEST pins in \`docker/DockerSettings.yaml\`, not the latest web vault).

          Where the checksums come from:
          - web vault \`$WEB_VAULT_SHA256\`: the \`sha256sums.txt\` of [bw_web_builds $WEB_VAULT_VERSION](https://github.com/$WEB_VAULT_UPSTREAM/releases/tag/$WEB_VAULT_VERSION); the tarball was checked against it.
          - source \`$SOURCE_SHA256\`: computed from the archive GitHub serves for tag $LATEST. Vaultwarden publishes no checksum for it; the archive was checked to be commit \`$COMMIT\`, the one the GitHub API names for the tag. The release build checks it again.

          Read the release notes first: database migrations run at start and are not reversible.

          Merging this changes nothing for Scalingo. After merging, publish a release of this repository: the release workflow builds it and opens the pull request that pins it.

          Opened by the update workflow, which also started \`ci.yml\` and \`release.yml\` on this branch (a pull request opened with GITHUB_TOKEN starts no workflow): the build is proven before you merge."
          if ! gh pr create --base "$BASE" --head "$BRANCH" --title "$title" --body "$body"; then
            echo "::error::GitHub refused to open the pull request. Enable Settings > Actions > General > Workflow permissions > 'Allow GitHub Actions to create and approve pull requests', then delete the branch $BRANCH and re-run this workflow. Or open a pull request from $BRANCH by hand."
            exit 1
          fi
          gh workflow run ci.yml --ref "$BRANCH"
          gh workflow run release.yml --ref "$BRANCH"
