# Fixture: an update workflow that asks the API for a tag by its bare name (a branch of the same name answers too).
name: Update
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: gh api "repos/$UPSTREAM/commits/$LATEST" --jq .sha
